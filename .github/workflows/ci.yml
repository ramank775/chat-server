name: "ci"

on:
  push:
    # The working branch (v3.0) runs nothing on push; a v* tag runs it all.
    branches:
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "v3.0"
      - "master"
  # conformance (below) needs the whole microservice stack: by hand from the
  # Actions tab, or on a v* tag
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # the chart once stopped rendering unnoticed (decision 191)
      - run: helm lint deployment/helm && helm template deployment/helm > /dev/null

  # the DB-backed suites once per backend (TEST_DB); everything else runs in both
  unit:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        db: [mongo, pg]
    services:
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB: ${{ matrix.db }}
      MONGO_URL: "mongodb://root:password@localhost:27017/?authSource=admin"
      PG_URL: "postgres://postgres:password@localhost:5432/postgres"
      REDIS_ENDPOINT: "localhost:6379"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Wait for Mongo auth to accept connections
        run: |
          for i in $(seq 1 30); do
            node -e "const {MongoClient}=require('mongodb');new MongoClient(process.env.MONGO_URL,{serverSelectionTimeoutMS:2000}).connect().then(c=>c.close()).then(()=>process.exit(0)).catch(()=>process.exit(1))" && exit 0
            sleep 2
          done
          echo "Mongo never became reachable" && exit 1
      - run: npm test

  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: chat-server:ci

  # A v* tag publishes the image to Docker Hub once lint and tests pass,
  # with the CI environment's secrets (the v2 pipeline's).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, unit]
    runs-on: ubuntu-26.04
    environment: CI
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY_IMAGE }}:${{ github.ref_name }}

  # The conformance suite (test/conformance) against the microservice layout
  # (decision 191): this commit's image, docker-compose.infra.yml plus
  # docker-compose.yml with .env.tmpl's dev settings (mock SMS, NATS, mongo,
  # MinIO), every request through nginx. By hand, and on a v* tag; it does
  # not hold up `publish`, which ships the monolith's image either way.
  conformance:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    env:
      CHAT_SERVER_TAG: ci
      COMPOSE: docker compose -p conformance --env-file .env.tmpl -f docker-compose.infra.yml -f docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: docker build -t ramank775/chatserver:ci .
      - name: Start the microservice stack
        working-directory: deployment
        run: |
          $COMPOSE up -d
          for i in $(seq 1 90); do
            # profile answers through nginx; give the services started beside it a moment
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8085/v3.0/users/me)" = 401 ] && sleep 5 && exit 0
            sleep 2
          done
          echo "the stack never answered" && $COMPOSE ps -a && exit 1
      - run: npm run test:conformance
      - name: Service logs
        if: failure()
        working-directory: deployment
        run: $COMPOSE logs --no-color
      - name: Stop the stack
        if: always()
        working-directory: deployment
        run: $COMPOSE down -v
