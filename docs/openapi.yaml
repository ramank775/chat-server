openapi: 3.1.0
info:
  title: Vartalap
  description: >-
    [Vartalap](https://vartalap.one9x.org/) is an open source personal chat
    application. It is design to provide the level of transparency in the
    personal messaging application with your data.


    This is a API documentation of the Vartalap.


    For Authorization always set the following headers


    ``` plaintext

    accesskey= # Authentication token as response of login api

    user= # Authenticated username

    ```
  version: 1.0.0
servers:
  - url: https://{{baseurl}}
components:
  securitySchemes:
    apikeyAuth:
      type: http
      scheme: apikey
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <accesskey>` (AUTH_CONTRACT 4.1)'
  schemas:
    ErrorEnvelope:
      type: object
      description: AUTH_CONTRACT 11.1
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
    OpFields:
      type: object
      description: >-
        SYNC_PROTOCOL 11.2: every v3 REST write carries these. The same
        `op_id` replays the stored status and body (7.1), best effort: the
        dedup window may be lost on a server restart, so clients dedupe what
        they receive by `op_id`.
      properties:
        op_id:
          type: string
          format: uuid
          description: Client minted UUIDv7 with the caller's user_id in it (3); else `prefix_mismatch`
        client_timestamp_ms:
          type: integer
          description: Advisory only, never used for ordering
        resource_seq:
          type: integer
          deprecated: true
          description: >-
            Retired (decision 127). The server keeps no per-resource counter
            and never answers `out_of_order`; a value an older client still
            sends is accepted and ignored.
      required: [op_id]
    Channel:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [group]
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        created_at:
          type: integer
          description: ms since epoch
    UserId:
      type: string
      pattern: '^[0-9a-f]{9}$'
    KeyRegistration:
      type: object
      additionalProperties: false
      required: [identityKey, registrationId, signedPreKey, preKeys]
      properties:
        identityKey:
          type: string
          description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
        registrationId:
          type: integer
          minimum: 1
          maximum: 16383
        signedPreKey:
          type: object
          additionalProperties: false
          required: [id, publicKey, signature]
          properties:
            id:
              type: integer
              minimum: 0
              maximum: 16777215
            publicKey:
              type: string
              description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
            signature:
              type: string
              description: Canonical padded base64 of a 64-byte signature, verified by clients
        preKeys:
          type: array
          maxItems: 200
          description: >-
            Distinct ids, monotonically increasing across uploads. Ids at or
            below the previously uploaded maximum are ignored on retry, even
            after consumption; at most 200 unclaimed keys may be stored.
          items:
            type: object
            additionalProperties: false
            required: [id, publicKey]
            properties:
              id:
                type: integer
                minimum: 0
                maximum: 16777215
              publicKey:
                type: string
                description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
  responses:
    AuthError:
      description: >-
        401 `MISSING_ACCESSKEY` / `INVALID_ACCESSKEY`, or 403
        `USERNAME_REQUIRED` while the account has no username (AUTH_CONTRACT 2.4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChannelWriteError:
      description: >-
        8.2, lowercase codes: 400 `validation_failed` / `prefix_mismatch`,
        403 `forbidden` (not a member, or lacks the role), 404 `not_found`,
        409 `resource_id_taken`, 412 `precondition_failed` (100 member cap).
        Never `out_of_order` (decision 127).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
security:
  - apikeyAuth: []
tags:
  - name: v1.0
  - name: v1.0 > Assets
    description: File service endpoint to upload and download files
  - name: v3.0 > Push
    description: >-
      Web Push (RFC 8030) endpoint registration, AUTH_CONTRACT 5. Every wake is
      encrypted to the device keys (RFC 8291, aes128gcm), VAPID signed
      (RFC 8292) and carries only `{"t":"wake"}`.
  - name: v3.0 > Channels
    description: >-
      Group channels (SYNC_PROTOCOL 11.3). A DM has no row: its id is derived
      from the pair. Every write fans a server event (payload `0x53`) out on
      the sync wire to the affected members.
  - name: v3.0 > Sync
    description: >-
      The REST half of the sync wire (`wss://<host>/wss` carries protobuf
      `WsEnvelope` frames, proto/v3-envelope.proto). The server keeps no
      per-channel order: it stamps `server_timestamp_ms` on every envelope
      and returns it on the `Ack`, and clients order a channel by
      (`server_timestamp_ms`, `op_id`). `Envelope.resource_seq` (3),
      `Envelope.delivery_sequence` (22) and `Ack.delivery_sequence` (6) are
      retired and reserved (decision 127).
paths:
  /v3.0/keys/me:
    put:
      summary: Register or replenish this authenticated device's public E2EE keys
      description: >-
        AUTH_CONTRACT 17. Server foundation only; client encryption is pending.
        Owner account/device come from the session. The first upload or changed
        identity creates a new UUID generation. Same-identity retries preserve
        the generation and never restore consumed prekey ids. A registration id
        stays stable per identity; signed prekey ids cannot be overwritten or
        rolled back. 60 publications per account per hour. One active phone per
        account (decision 183): a login on another phone deletes this device's
        keys, and an upload racing that login is withdrawn with a 401.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRegistration'
      responses:
        '200':
          description: Public device bundle (deviceId, generation, identityKey, registrationId, signedPreKey) plus preKeyCount
        '400':
          description: Invalid key shape, duplicate prekey ids, private or unknown fields
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '409':
          description: KEY_CONFLICT or PREKEY_CAPACITY
        '429':
          description: RATE_LIMITED
        '503':
          description: KEYS_BUSY; retry with backoff
  /v3.0/keys/{userId}:
    get:
      summary: List an account's registered public device bundles
      description: >-
        AUTH_CONTRACT 17.2. No one-time keys, internal revisions or counters
        are returned. An existing account with no keys has an empty device
        list. Reads and claims share 1000 requests/account/hour and
        2000 requests/IP/hour. Logout retains keys; account deletion purges them.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: '{devices:[{deviceId,generation,identityKey,registrationId,signedPreKey}]}'
        '400':
          description: Invalid account id
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          description: KEYS_NOT_FOUND (unknown or deleted account)
        '429':
          description: RATE_LIMITED
  /v3.0/keys/{userId}/claim:
    post:
      summary: Atomically claim one one-time prekey from a device generation
      description: >-
        AUTH_CONTRACT 17.3. Returns the public bundle and preKey:{id,publicKey},
        or preKey:null when exhausted. Clients verify signatures and identity
        trust; they never fall back to plaintext. A stale generation requires
        refetching the directory and applying the identity-trust policy.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, generation]
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 256
                generation:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Public device bundle plus preKey (object or null)
        '400':
          description: Invalid account id, device id or generation
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          description: KEYS_NOT_FOUND (unknown account, device or generation)
        '429':
          description: RATE_LIMITED
        '503':
          description: KEYS_BUSY; retry with backoff
  /v3.0/channels:
    get:
      tags:
        - v3.0 > Channels
      summary: List the caller's groups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every group the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/AuthError'
    post:
      tags:
        - v3.0 > Channels
      summary: Create a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    channel_id:
                      type: string
                      format: uuid
                      description: Client minted, never reassigned
                    kind:
                      type: string
                      enum: [group]
                    name:
                      type: [string, 'null']
                    avatar_url:
                      type: [string, 'null']
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      description: Must include the caller, who becomes the owner
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [channel_id, kind, members]
      responses:
        '201':
          description: Created; `ChannelCreated` fans out to the members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '409':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags:
        - v3.0 > Channels
      summary: Get one group the caller is in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Rename or re-avatar a group (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    name:
                      type: string
                    avatar_url:
                      type: [string, 'null']
                  anyOf:
                    - required: [name]
                    - required: [avatar_url]
      responses:
        '200':
          description: Edited; `ChannelEdited` fans out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    delete:
      tags:
        - v3.0 > Channels
      summary: Delete a group (owner) or leave it (anyone else)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Left; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '204':
          description: Deleted by the owner; `ChannelDeleted` fans out
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags:
        - v3.0 > Channels
      summary: Add members (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [members]
      responses:
        '200':
          description: Added; `ChannelMemberAdded` fans out to old and new members
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
        '412':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - v3.0 > Channels
      summary: Remove a member (owner, admin) or leave (yourself)
      description: >-
        A leaving owner hands the group to the longest standing admin, else
        the longest standing member; the last member out deletes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Removed; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Promote to admin or demote to member (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    role:
                      type: string
                      enum: [admin, member]
                  required: [role]
      responses:
        '200':
          description: Changed; re-announced as `ChannelMemberAdded{role}`
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    $ref: '#/components/schemas/UserId'
                  role:
                    type: string
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/sync/pending:
    get:
      tags:
        - v3.0 > Sync
      summary: Read the caller's timeline from this device's pointer
      description: >-
        Every `WsEnvelope{type: WS_PUSH}` fanned out to the calling user is
        kept once on the server, pushed live or not, until it expires: its
        sender's `ttl_sec`, at most and by default 30 days. This returns
        the unexpired ones naming this user with a `server_timestamp_ms` at or after
        `since`, oldest first (then by `op_id`), up to 500, leaving out what
        this very device sent. It removes nothing and remembers nothing: the
        device keeps the newest `server_timestamp_ms` it has handled and
        passes it as `since` next time; the frames at that millisecond come
        back and the client's `op_id` dedup absorbs them. The timeline
        survives server restarts. Clients order what they receive by
        (`server_timestamp_ms`, `op_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: The device's pointer, a server_timestamp_ms, inclusive; 0 or absent reads everything kept
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The frames from the pointer on; empty when there are none
          content:
            application/json:
              schema:
                type: object
                properties:
                  frames:
                    type: array
                    items:
                      type: string
                      contentEncoding: base64
                      description: A serialized `WsEnvelope` (proto/v3-envelope.proto) with `push` set
                  more:
                    type: boolean
                    description: More frames wait past this page; pull again from its last server_timestamp_ms
                required: [frames, more]
        '400':
          description: '`since` is not a non-negative integer'
        '401':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/vapid:
    get:
      tags:
        - v3.0 > Push
      summary: Get the server VAPID public key
      description: >-
        The key the client passes to its UnifiedPush distributor, so the
        distributor accepts only pushes signed by this server. A changed key
        means the client re-registers with its distributor and re-posts
        `/v3.0/push/topic`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey:
                    type: string
                    description: Uncompressed P-256 point, base64url without padding (87 chars)
                    example: BCkGhRTonSgzpIq9SrkFnnsNHs_HsBiTun0IHDO7tzVdPx7WXt_2BueoMz9azMG0lB_UVBWFmkgTO6yc-T0UiCA
                required: [vapidPublicKey]
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/topic:
    post:
      tags:
        - v3.0 > Push
      summary: Register, replace or deregister the device push endpoint
      description: >-
        One endpoint per `(user_id, deviceId)`; a registration replaces the
        previous one. `endpoint` null or empty deregisters (keys ignored).
        Logout, account deletion, phone rebind and a 404/410 from the push
        service deregister implicitly (AUTH_CONTRACT 5.2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: [string, 'null']
                  maxLength: 2048
                  description: >-
                    The UnifiedPush endpoint. https, no userinfo, and a host
                    that resolves only to public unicast addresses.
                  example: https://ntfy.sh/upAbC123
                p256dh:
                  type: string
                  description: Device ECDH public key, uncompressed P-256 point (65 bytes), base64url
                  example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
                auth:
                  type: string
                  description: Device auth secret (16 bytes), base64url
                  example: tBHItJI5svbpez7KI4CCXg
              required: [endpoint]
      responses:
        '200':
          description: Registered, replaced or deregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: >-
            `INVALID_PUSH_ENDPOINT`: not https, over 2048 chars, has userinfo,
            or resolves to a non public address. `INVALID_PUSH_KEYS`: `p256dh`
            or `auth` missing or malformed. `validation_failed`: `endpoint`
            absent or not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                endpoint:
                  value:
                    error:
                      code: INVALID_PUSH_ENDPOINT
                      message: endpoint must be an https url on a public host
                keys:
                  value:
                    error:
                      code: INVALID_PUSH_KEYS
                      message: p256dh must be a 65 byte P-256 point and auth 16 bytes, base64url
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v1.0/assets/upload/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Generate Presigned URL for upload
      parameters:
        - name: ext
          in: query
          schema:
            type: string
          example: .png
        - name: category
          in: query
          schema:
            type: string
          example: chat
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/download/{assetId}/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Get Presigned Url to download assets
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/{assetId}/status:
    put:
      tags:
        - v1.0 > Assets
      summary: Update Asset Status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                status: true
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
