openapi: 3.1.0
info:
  title: Vartalap
  description: >-
    [Vartalap](https://vartalap.one9x.org/) is an open source personal chat
    application. It is design to provide the level of transparency in the
    personal messaging application with your data.


    This is a API documentation of the Vartalap.


    For Authorization always set the following headers


    ``` plaintext

    accesskey= # Authentication token as response of login api

    user= # Authenticated username

    ```
  version: 1.0.0
servers:
  - url: https://{{baseurl}}
components:
  securitySchemes:
    apikeyAuth:
      type: http
      scheme: apikey
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <accesskey>` (AUTH_CONTRACT 4.1)'
  schemas:
    ErrorEnvelope:
      type: object
      description: AUTH_CONTRACT 11.1
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
    OpFields:
      type: object
      description: >-
        SYNC_PROTOCOL 11.2: every v3 REST write carries these. The same
        `op_id` replays the stored status and body (7.1), best effort: the
        dedup window may be lost on a server restart, so clients dedupe what
        they receive by `op_id`.
      properties:
        op_id:
          type: string
          format: uuid
          description: Client minted UUIDv7 with the caller's user_id in it (3); else `prefix_mismatch`
        client_timestamp_ms:
          type: integer
          description: Advisory only, never used for ordering
        resource_seq:
          type: integer
          deprecated: true
          description: >-
            Retired (decision 127). The server keeps no per-resource counter
            and never answers `out_of_order`; a value an older client still
            sends is accepted and ignored.
      required: [op_id]
    Channel:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [group]
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        created_at:
          type: integer
          description: ms since epoch
    UserId:
      type: string
      pattern: '^[0-9a-f]{9}$'
  responses:
    AuthError:
      description: >-
        401 `MISSING_ACCESSKEY` / `INVALID_ACCESSKEY`, or 403
        `USERNAME_REQUIRED` while the account has no username (AUTH_CONTRACT 2.4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChannelWriteError:
      description: >-
        8.2, lowercase codes: 400 `validation_failed` / `prefix_mismatch`,
        403 `forbidden` (not a member, or lacks the role), 404 `not_found`,
        409 `resource_id_taken`, 412 `precondition_failed` (100 member cap).
        Never `out_of_order` (decision 127).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
security:
  - apikeyAuth: []
tags:
  - name: v1.0
  - name: v1.0 > Auth
    description: Authentication endpoints
  - name: v1.0 > Profile
    description: User Profile Endpoints
  - name: v1.0 > Gateway
    description: >-
      Web socket and HTTP Gateway


      As postman doesn't yet support adding web socket request in normal
      collection.


      Endpoint: `wss://{{hostname}}/wss`
  - name: v1.0 > Group
    description: Endpoints for performing group related actions
  - name: v1.0 > Assets
    description: File service endpoint to upload and download files
  - name: v1.0 > Contact Book
  - name: v3.0 > Push
    description: >-
      Web Push (RFC 8030) endpoint registration, AUTH_CONTRACT 5. Every wake is
      encrypted to the device keys (RFC 8291, aes128gcm), VAPID signed
      (RFC 8292) and carries only `{"t":"wake"}`.
  - name: v3.0 > Channels
    description: >-
      Group channels (SYNC_PROTOCOL 11.3). A DM has no row: its id is derived
      from the pair. Every write fans a server event (payload `0x53`) out on
      the sync wire to the affected members.
  - name: v3.0 > Sync
    description: >-
      The REST half of the sync wire (`wss://<host>/wss` carries protobuf
      `WsEnvelope` frames, proto/v3-envelope.proto). The server keeps no
      per-channel order: it stamps `server_timestamp_ms` on every envelope
      and returns it on the `Ack`, and clients order a channel by
      (`server_timestamp_ms`, `op_id`). `Envelope.resource_seq` (3),
      `Envelope.delivery_sequence` (22) and `Ack.delivery_sequence` (6) are
      retired and reserved (decision 127).
paths:
  /v3.0/channels:
    get:
      tags:
        - v3.0 > Channels
      summary: List the caller's groups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every group the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/AuthError'
    post:
      tags:
        - v3.0 > Channels
      summary: Create a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    channel_id:
                      type: string
                      format: uuid
                      description: Client minted, never reassigned
                    kind:
                      type: string
                      enum: [group]
                    name:
                      type: [string, 'null']
                    avatar_url:
                      type: [string, 'null']
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      description: Must include the caller, who becomes the owner
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [channel_id, kind, members]
      responses:
        '201':
          description: Created; `ChannelCreated` fans out to the members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '409':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags:
        - v3.0 > Channels
      summary: Get one group the caller is in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Rename or re-avatar a group (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    name:
                      type: string
                    avatar_url:
                      type: [string, 'null']
                  anyOf:
                    - required: [name]
                    - required: [avatar_url]
      responses:
        '200':
          description: Edited; `ChannelEdited` fans out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    delete:
      tags:
        - v3.0 > Channels
      summary: Delete a group (owner) or leave it (anyone else)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Left; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '204':
          description: Deleted by the owner; `ChannelDeleted` fans out
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags:
        - v3.0 > Channels
      summary: Add members (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [members]
      responses:
        '200':
          description: Added; `ChannelMemberAdded` fans out to old and new members
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
        '412':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - v3.0 > Channels
      summary: Remove a member (owner, admin) or leave (yourself)
      description: >-
        A leaving owner hands the group to the longest standing admin, else
        the longest standing member; the last member out deletes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Removed; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Promote to admin or demote to member (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    role:
                      type: string
                      enum: [admin, member]
                  required: [role]
      responses:
        '200':
          description: Changed; re-announced as `ChannelMemberAdded{role}`
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    $ref: '#/components/schemas/UserId'
                  role:
                    type: string
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/sync/pending:
    get:
      tags:
        - v3.0 > Sync
      summary: Read the caller's timeline from this device's pointer
      description: >-
        Every `WsEnvelope{type: WS_PUSH}` fanned out to the calling user is
        kept once on the server for 30 days, pushed live or not. This returns
        the ones naming this user with a `server_timestamp_ms` at or after
        `since`, oldest first (then by `op_id`), up to 500, leaving out what
        this very device sent. It removes nothing and remembers nothing: the
        device keeps the newest `server_timestamp_ms` it has handled and
        passes it as `since` next time; the frames at that millisecond come
        back and the client's `op_id` dedup absorbs them. The timeline
        survives server restarts. Clients order what they receive by
        (`server_timestamp_ms`, `op_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: The device's pointer, a server_timestamp_ms, inclusive; 0 or absent reads everything kept
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The frames from the pointer on; empty when there are none
          content:
            application/json:
              schema:
                type: object
                properties:
                  frames:
                    type: array
                    items:
                      type: string
                      contentEncoding: base64
                      description: A serialized `WsEnvelope` (proto/v3-envelope.proto) with `push` set
                  more:
                    type: boolean
                    description: More frames wait past this page; pull again from its last server_timestamp_ms
                required: [frames, more]
        '400':
          description: '`since` is not a non-negative integer'
        '401':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/vapid:
    get:
      tags:
        - v3.0 > Push
      summary: Get the server VAPID public key
      description: >-
        The key the client passes to its UnifiedPush distributor, so the
        distributor accepts only pushes signed by this server. A changed key
        means the client re-registers with its distributor and re-posts
        `/v3.0/push/topic`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey:
                    type: string
                    description: Uncompressed P-256 point, base64url without padding (87 chars)
                    example: BCkGhRTonSgzpIq9SrkFnnsNHs_HsBiTun0IHDO7tzVdPx7WXt_2BueoMz9azMG0lB_UVBWFmkgTO6yc-T0UiCA
                required: [vapidPublicKey]
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/topic:
    post:
      tags:
        - v3.0 > Push
      summary: Register, replace or deregister the device push endpoint
      description: >-
        One endpoint per `(user_id, deviceId)`; a registration replaces the
        previous one. `endpoint` null or empty deregisters (keys ignored).
        Logout, account deletion, phone rebind and a 404/410 from the push
        service deregister implicitly (AUTH_CONTRACT 5.2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: [string, 'null']
                  maxLength: 2048
                  description: >-
                    The UnifiedPush endpoint. https, no userinfo, and a host
                    that resolves only to public unicast addresses.
                  example: https://ntfy.sh/upAbC123
                p256dh:
                  type: string
                  description: Device ECDH public key, uncompressed P-256 point (65 bytes), base64url
                  example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
                auth:
                  type: string
                  description: Device auth secret (16 bytes), base64url
                  example: tBHItJI5svbpez7KI4CCXg
              required: [endpoint]
      responses:
        '200':
          description: Registered, replaced or deregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: >-
            `INVALID_PUSH_ENDPOINT`: not https, over 2048 chars, has userinfo,
            or resolves to a non public address. `INVALID_PUSH_KEYS`: `p256dh`
            or `auth` missing or malformed. `validation_failed`: `endpoint`
            absent or not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                endpoint:
                  value:
                    error:
                      code: INVALID_PUSH_ENDPOINT
                      message: endpoint must be an https url on a public host
                keys:
                  value:
                    error:
                      code: INVALID_PUSH_KEYS
                      message: p256dh must be a 65 byte P-256 point and auth 16 bytes, base64url
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v1.0/login:
    post:
      tags:
        - v1.0 > Auth
      summary: Login With Firebase
      description: Authenticate with Firebase such as Phone Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: '{{username}}'
                authToken: '{{firebase_auth_token}}'
                notificationToken: fcm token
                deviceId: default
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/profile/:
    get:
      tags:
        - v1.0 > Profile
      summary: Get Profile
      description: Get User profile
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/messages:
    post:
      tags:
        - v1.0 > Gateway
      summary: Send Message
      description: Http endpoint to send messages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                - >-
                  {"_v":2,"id":"string","head":{"type":"chat|group|channel|bot|notification","to":"username|group_id|channel_id|bot_id","from":"username","chatid":"chatid","contentType":"json|text|video|audio|location|form","action":"message|ack|subscribe|unsubscribe|join|leave|create|add-member|remove-member"},"meta":{"hash":"md5:hash","content_hash":"md5:hash","generate_ts":123455667890},"body":{"text":"Hello
                  this a text message"}}
                - >-
                  {"_v":2,"id":"string","head":{"type":"chat|group|channel|bot|notification","to":"username|group_id|channel_id|bot_id","from":"username","chatid":"chatid","contentType":"json|text|video|audio|location|form","action":"message|ack|subscribe|unsubscribe|join|leave|create|add-member|remove-member"},"meta":{"hash":"md5:hash","content_hash":"md5:hash","generate_ts":123455667890},"body":{"text":"Hello
                  this a text message"}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/:
    get:
      tags:
        - v1.0 > Group
      summary: Get All Groups
      description: Get All the groups user have access to
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - v1.0 > Group
      summary: Create New Group
      description: Create new group chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Group Name/Title
                profilePic: profile-pic-id
                members:
                  - member_1_username
                  - member_2_username
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/{groupId}:
    get:
      tags:
        - v1.0 > Group
      summary: Get Group Info
      description: Get group chat information including name, display pic, members
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/{groupId}/members:
    post:
      tags:
        - v1.0 > Group
      summary: Add Members to Group
      description: Add members to existing group chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                members:
                  - member_3_username
                  - member_4_username
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - v1.0 > Group
      summary: Remove Member From Group
      description: >-
        Remove other members only valid if you have admin permission or Leave
        group chat.
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/upload/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Generate Presigned URL for upload
      parameters:
        - name: ext
          in: query
          schema:
            type: string
          example: .png
        - name: category
          in: query
          schema:
            type: string
          example: chat
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/download/{assetId}/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Get Presigned Url to download assets
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/{assetId}/status:
    put:
      tags:
        - v1.0 > Assets
      summary: Update Asset Status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                status: true
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/contactbook/sync:
    post:
      tags:
        - v1.0 > Contact Book
      summary: Sync Contact
      description: Sync contact book, to fetch list of users using this service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                users:
                  - username_1
                  - username_2
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
