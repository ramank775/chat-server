openapi: 3.1.0
info:
  title: Vartalap
  description: >-
    [Vartalap](https://vartalap.one9x.org/) is an open source personal chat
    application. It is design to provide the level of transparency in the
    personal messaging application with your data.


    This is a API documentation of the Vartalap.


    For Authorization always set the following headers


    ``` plaintext

    accesskey= # Authentication token as response of login api

    user= # Authenticated username

    ```
  version: 1.0.0
servers:
  - url: https://{{baseurl}}
components:
  securitySchemes:
    apikeyAuth:
      type: http
      scheme: apikey
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <accesskey>` (AUTH_CONTRACT 4.1)'
  schemas:
    ErrorEnvelope:
      type: object
      description: AUTH_CONTRACT 11.1
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
  responses:
    AuthError:
      description: >-
        401 `MISSING_ACCESSKEY` / `INVALID_ACCESSKEY`, or 403
        `USERNAME_REQUIRED` while the account has no username (AUTH_CONTRACT 2.4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
security:
  - apikeyAuth: []
tags:
  - name: v1.0
  - name: v1.0 > Auth
    description: Authentication endpoints
  - name: v1.0 > Profile
    description: User Profile Endpoints
  - name: v1.0 > Gateway
    description: >-
      Web socket and HTTP Gateway


      As postman doesn't yet support adding web socket request in normal
      collection.


      Endpoint: `wss://{{hostname}}/wss`
  - name: v1.0 > Group
    description: Endpoints for performing group related actions
  - name: v1.0 > Assets
    description: File service endpoint to upload and download files
  - name: v1.0 > Contact Book
  - name: v3.0 > Push
    description: >-
      Web Push (RFC 8030) endpoint registration, AUTH_CONTRACT 5. Every wake is
      encrypted to the device keys (RFC 8291, aes128gcm), VAPID signed
      (RFC 8292) and carries only `{"t":"wake"}`.
paths:
  /v3.0/push/vapid:
    get:
      tags:
        - v3.0 > Push
      summary: Get the server VAPID public key
      description: >-
        The key the client passes to its UnifiedPush distributor, so the
        distributor accepts only pushes signed by this server. A changed key
        means the client re-registers with its distributor and re-posts
        `/v3.0/push/topic`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey:
                    type: string
                    description: Uncompressed P-256 point, base64url without padding (87 chars)
                    example: BCkGhRTonSgzpIq9SrkFnnsNHs_HsBiTun0IHDO7tzVdPx7WXt_2BueoMz9azMG0lB_UVBWFmkgTO6yc-T0UiCA
                required: [vapidPublicKey]
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/topic:
    post:
      tags:
        - v3.0 > Push
      summary: Register, replace or deregister the device push endpoint
      description: >-
        One endpoint per `(user_id, deviceId)`; a registration replaces the
        previous one. `endpoint` null or empty deregisters (keys ignored).
        Logout, account deletion, phone rebind and a 404/410 from the push
        service deregister implicitly (AUTH_CONTRACT 5.2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: [string, 'null']
                  maxLength: 2048
                  description: >-
                    The UnifiedPush endpoint. https, no userinfo, and a host
                    that resolves only to public unicast addresses.
                  example: https://ntfy.sh/upAbC123
                p256dh:
                  type: string
                  description: Device ECDH public key, uncompressed P-256 point (65 bytes), base64url
                  example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
                auth:
                  type: string
                  description: Device auth secret (16 bytes), base64url
                  example: tBHItJI5svbpez7KI4CCXg
              required: [endpoint]
      responses:
        '200':
          description: Registered, replaced or deregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: >-
            `INVALID_PUSH_ENDPOINT`: not https, over 2048 chars, has userinfo,
            or resolves to a non public address. `INVALID_PUSH_KEYS`: `p256dh`
            or `auth` missing or malformed. `validation_failed`: `endpoint`
            absent or not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                endpoint:
                  value:
                    error:
                      code: INVALID_PUSH_ENDPOINT
                      message: endpoint must be an https url on a public host
                keys:
                  value:
                    error:
                      code: INVALID_PUSH_KEYS
                      message: p256dh must be a 65 byte P-256 point and auth 16 bytes, base64url
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v1.0/login:
    post:
      tags:
        - v1.0 > Auth
      summary: Login With Firebase
      description: Authenticate with Firebase such as Phone Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                username: '{{username}}'
                authToken: '{{firebase_auth_token}}'
                notificationToken: fcm token
                deviceId: default
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/profile/:
    get:
      tags:
        - v1.0 > Profile
      summary: Get Profile
      description: Get User profile
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/messages:
    post:
      tags:
        - v1.0 > Gateway
      summary: Send Message
      description: Http endpoint to send messages
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                - >-
                  {"_v":2,"id":"string","head":{"type":"chat|group|channel|bot|notification","to":"username|group_id|channel_id|bot_id","from":"username","chatid":"chatid","contentType":"json|text|video|audio|location|form","action":"message|ack|subscribe|unsubscribe|join|leave|create|add-member|remove-member"},"meta":{"hash":"md5:hash","content_hash":"md5:hash","generate_ts":123455667890},"body":{"text":"Hello
                  this a text message"}}
                - >-
                  {"_v":2,"id":"string","head":{"type":"chat|group|channel|bot|notification","to":"username|group_id|channel_id|bot_id","from":"username","chatid":"chatid","contentType":"json|text|video|audio|location|form","action":"message|ack|subscribe|unsubscribe|join|leave|create|add-member|remove-member"},"meta":{"hash":"md5:hash","content_hash":"md5:hash","generate_ts":123455667890},"body":{"text":"Hello
                  this a text message"}}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/:
    get:
      tags:
        - v1.0 > Group
      summary: Get All Groups
      description: Get All the groups user have access to
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - v1.0 > Group
      summary: Create New Group
      description: Create new group chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: Group Name/Title
                profilePic: profile-pic-id
                members:
                  - member_1_username
                  - member_2_username
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/{groupId}:
    get:
      tags:
        - v1.0 > Group
      summary: Get Group Info
      description: Get group chat information including name, display pic, members
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/groups/{groupId}/members:
    post:
      tags:
        - v1.0 > Group
      summary: Add Members to Group
      description: Add members to existing group chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                members:
                  - member_3_username
                  - member_4_username
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
        - v1.0 > Group
      summary: Remove Member From Group
      description: >-
        Remove other members only valid if you have admin permission or Leave
        group chat.
      parameters:
        - name: groupId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/upload/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Generate Presigned URL for upload
      parameters:
        - name: ext
          in: query
          schema:
            type: string
          example: .png
        - name: category
          in: query
          schema:
            type: string
          example: chat
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/download/{assetId}/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Get Presigned Url to download assets
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/{assetId}/status:
    put:
      tags:
        - v1.0 > Assets
      summary: Update Asset Status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                status: true
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/contactbook/sync:
    post:
      tags:
        - v1.0 > Contact Book
      summary: Sync Contact
      description: Sync contact book, to fetch list of users using this service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                users:
                  - username_1
                  - username_2
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
