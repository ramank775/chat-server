openapi: 3.1.0
info:
  title: Vartalap
  description: >-
    [Vartalap](https://vartalap.one9x.org/) is an open source personal chat
    application. It is design to provide the level of transparency in the
    personal messaging application with your data.


    This is a API documentation of the Vartalap.


    For Authorization always set the following headers


    ``` plaintext

    accesskey= # Authentication token as response of login api

    user= # Authenticated username

    ```


    Phones send `x-app-build: <versionCode>` on every request and on the
    `/wss` upgrade (decision 192). Below the server's minimum build every
    request answers 426 `UPGRADE_REQUIRED`, and responses carry
    `x-latest-app-build` while a newer build is out.
  version: 1.0.0
servers:
  - url: https://{{baseurl}}
components:
  securitySchemes:
    apikeyAuth:
      type: http
      scheme: apikey
    bearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <accesskey>` (AUTH_CONTRACT 4.1)'
  schemas:
    ErrorEnvelope:
      type: object
      description: AUTH_CONTRACT 11.1
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
    OpFields:
      type: object
      description: >-
        SYNC_PROTOCOL 11.2: every v3 REST write carries these. The same
        `op_id` replays the stored status and body (7.1), best effort: the
        dedup window may be lost on a server restart, so clients dedupe what
        they receive by `op_id`.
      properties:
        op_id:
          type: string
          format: uuid
          description: Client minted UUIDv7 with the caller's user_id in it (3); else `prefix_mismatch`
        client_timestamp_ms:
          type: integer
          description: Advisory only, never used for ordering
        resource_seq:
          type: integer
          deprecated: true
          description: >-
            Retired (decision 127). The server keeps no per-resource counter
            and never answers `out_of_order`; a value an older client still
            sends is accepted and ignored.
      required: [op_id]
    Channel:
      type: object
      properties:
        channel_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [group]
        name:
          type: [string, 'null']
        avatar_url:
          type: [string, 'null']
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        roles:
          type: object
          additionalProperties:
            type: string
            enum: [owner, admin, member]
        invited:
          type: array
          description: Pending invitees, not members yet (decision 221)
          items:
            $ref: '#/components/schemas/UserId'
        created_at:
          type: integer
          description: ms since epoch
    Invite:
      type: object
      description: One pending invite (SYNC_PROTOCOL 23)
      properties:
        channel_id:
          type: string
          description: The group's id, or for a 1:1 invite the pair's derived DM id
        from:
          $ref: '#/components/schemas/UserId'
        to:
          $ref: '#/components/schemas/UserId'
        name:
          type: [string, 'null']
          description: The group's name; null on a 1:1 invite
        created_at:
          type: integer
          description: ms since epoch
    InviteState:
      type: object
      properties:
        state:
          type: string
          enum: [sent, connected, none]
    UserId:
      type: string
      pattern: '^[0-9a-f]{9}$'
    TimelinePhoto:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
          description: >-
            A media-ms upload (category `timeline`, not encrypted), fetched
            with `GET /v3.0/assets/download/{fileId}/presigned_url`
        width:
          type: integer
        height:
          type: integer
    TimelinePost:
      type: object
      description: A post as anyone in its audience sees it
      properties:
        postId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserId'
        text:
          type: [string, 'null']
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePhoto'
        createdAt:
          type: integer
          description: ms since epoch, server time
        myReaction:
          type: [string, 'null']
          description: The caller's own reaction; nobody else's, and no count
    OwnTimelinePost:
      type: object
      description: The poster's view of their own post
      properties:
        postId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserId'
        text:
          type: [string, 'null']
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePhoto'
        createdAt:
          type: integer
        audience:
          type: array
          items:
            $ref: '#/components/schemas/UserId'
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/TimelineReaction'
    TimelineReaction:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        emoji:
          type: string
        at:
          type: integer
          description: ms since epoch
    TimelinePage:
      type: object
      properties:
        posts:
          type: array
        next:
          type: [string, 'null']
          description: Pass as `before` for the next page; null on the last
    PresenceSetting:
      type: string
      enum: [everyone, contacts, nobody]
      default: everyone
      description: >-
        Who sees the user's last seen and online (SYNC_PROTOCOL 22).
        `contacts`: users connected by an accepted invite (decision 219).
        Reciprocal: one sees another's only while each shares with the
        other. A block, either way, hides it whatever the setting.
    KeyRegistration:
      type: object
      additionalProperties: false
      required: [identityKey, registrationId, signedPreKey, preKeys]
      properties:
        identityKey:
          type: string
          description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
        registrationId:
          type: integer
          minimum: 1
          maximum: 16383
        signedPreKey:
          type: object
          additionalProperties: false
          required: [id, publicKey, signature]
          properties:
            id:
              type: integer
              minimum: 0
              maximum: 16777215
            publicKey:
              type: string
              description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
            signature:
              type: string
              description: Canonical padded base64 of a 64-byte signature, verified by clients
        preKeys:
          type: array
          maxItems: 200
          description: >-
            Distinct ids, monotonically increasing across uploads. Ids at or
            below the previously uploaded maximum are ignored on retry, even
            after consumption; at most 200 unclaimed keys may be stored.
          items:
            type: object
            additionalProperties: false
            required: [id, publicKey]
            properties:
              id:
                type: integer
                minimum: 0
                maximum: 16777215
              publicKey:
                type: string
                description: Canonical base64 of a 33-byte Signal public key, starting with 0x05
  responses:
    AuthError:
      description: >-
        401 `MISSING_ACCESSKEY` / `INVALID_ACCESSKEY`, or 403
        `USERNAME_REQUIRED` while the account has no username (AUTH_CONTRACT 2.4)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChannelWriteError:
      description: >-
        8.2, lowercase codes: 400 `validation_failed` / `prefix_mismatch`,
        403 `forbidden` (not a member, or lacks the role), 404 `not_found`,
        409 `resource_id_taken`, 412 `precondition_failed` (100 member cap).
        Never `out_of_order` (decision 127).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
security:
  - apikeyAuth: []
tags:
  - name: v1.0
  - name: v1.0 > Assets
    description: File service endpoint to upload and download files
  - name: v3.0 > Discovery
    description: >-
      Finding people (AUTH_CONTRACT 7, decision 223). The server keeps a phone
      number only as its phone key, HMAC-SHA256 under the server secret
      `PHONE_PEPPER` of the SHA-256 hex of the E.164 number, which is also what
      the app sends to look a number up. Username lookups are unaffected by
      discoverability.
  - name: v3.0 > Push
    description: >-
      Web Push (RFC 8030) endpoint registration, AUTH_CONTRACT 5. Every wake is
      encrypted to the device keys (RFC 8291, aes128gcm), VAPID signed
      (RFC 8292) and carries only `{"t":"wake"}`.
  - name: v3.0 > Channels
    description: >-
      Group channels (SYNC_PROTOCOL 11.3). A DM has no row: its id is derived
      from the pair. Every write fans a server event (payload `0x53`) out on
      the sync wire to the affected members.
  - name: v3.0 > Timeline
    description: >-
      The private timeline (decision 223): posts of text and/or photos to an
      audience of user ids the phone resolves from its own labels (labels
      never reach the server). Plain REST, not the sync wire, and not
      end-to-end encrypted. Only the audience reads a post or reacts to it;
      only the poster sees who reacted, and nobody gets a count; only the
      poster deletes. A new post wakes nobody: the app refreshes the feed
      when it opens. Posts and their photos are deleted
      `--timeline-retention-days` (30) after they were posted, at once when
      the poster deletes one, and with the poster's account. Served by
      profile-ms.
  - name: v3.0 > Connecting
    description: >-
      Invite-only (decisions 219-221, SYNC_PROTOCOL 23): nothing flows 1:1
      until an invite is accepted (a 1:1 frame otherwise acks
      `not_connected`), and a group's newcomer is a member once they accept.
      Blocks and reports. Not queued and without `op_id`: each call is
      idempotent and the app shows its answer.
  - name: v3.0 > Sync
    description: >-
      The REST half of the sync wire (`wss://<host>/wss` carries protobuf
      `WsEnvelope` frames, proto/v3-envelope.proto). The server keeps no
      per-channel order: it stamps `server_timestamp_ms` on every envelope
      and returns it on the `Ack`, and clients order a channel by
      (`server_timestamp_ms`, `op_id`). `Envelope.resource_seq` (3),
      `Envelope.delivery_sequence` (22) and `Ack.delivery_sequence` (6) are
      retired and reserved (decision 127). Since decision 218 every id on
      the wire is raw bytes (op_id, group channel_id and device ids 16, a
      DM's `peer` 5), a DM sends `peer` and no `channel_id`, and the sender
      is read from the op_id; `Envelope.flags` bit 0 (SILENT, set by the
      sender) decides the push wake, and bits 1-4 carry the frame class,
      which sets a receipt's 7-day retention (decision 220). Class 8
      PRESENCE (SYNC_PROTOCOL 22) is ephemeral and between a phone and the
      server only: a phone's presence op (`peer` = whom it watches, payload
      `0x53` + `Presence{online}`) is never acked or fanned out, and the
      server answers with, and pushes changes as, PRESENCE frames whose
      `Presence{user_id, online, last_seen_ms}` the watched user's setting
      allows.
  - name: v3.0 > Users
    description: >-
      The account's own profile (AUTH_CONTRACT 4.4, 4.5). Only the
      presence setting is described here.
paths:
  /v3.0/users/me:
    get:
      tags:
        - v3.0 > Users
      summary: The own profile, with who sees its last seen and online
      security:
        - bearerAuth: []
      responses:
        '200':
          description: AUTH_CONTRACT 4.4; never another user's
          content:
            application/json:
              schema:
                type: object
                properties:
                  presence:
                    $ref: '#/components/schemas/PresenceSetting'
        '401':
          $ref: '#/components/responses/AuthError'
    patch:
      tags:
        - v3.0 > Users
      summary: Change profile fields, among them the presence setting
      description: >-
        AUTH_CONTRACT 4.5 for the other fields. A new `presence` reaches
        whoever watches this user at once (SYNC_PROTOCOL 22).
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                presence:
                  $ref: '#/components/schemas/PresenceSetting'
      responses:
        '200':
          description: The updated own profile, as GET
        '400':
          description: '`validation_failed`: not one of the three values'
        '401':
          $ref: '#/components/responses/AuthError'
        '429':
          description: Over the 50 per hour profile budget (AUTH_CONTRACT 10.6)
  /v3.0/auth/otp/resend:
    post:
      tags:
        - v3.0 > Discovery
      summary: Send the same code of a pending challenge again
      description: >-
        AUTH_CONTRACT 3.3. The server keeps no number to send to (decision
        223), so the request names it; it must be the number the challenge
        was started for (else 404 `SESSION_NOT_FOUND`, and no SMS). Without
        `phone` (an app from before) the answer is 410 `RESEND_UNAVAILABLE`
        and the app starts over with `/auth/otp/send`. Verify, rebind verify
        and `GET /users/me` no longer echo `phone`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                phone:
                  type: string
                  description: E.164
      responses:
        '200':
          description: '{sessionId, resendAfterSec, expiresInSec, isExistingAccount}'
        '404':
          description: SESSION_NOT_FOUND
        '410':
          description: RESEND_UNAVAILABLE, SESSION_EXPIRED or SESSION_CONSUMED
        '423':
          description: SESSION_LOCKED
        '429':
          description: OTP_RATE_LIMITED
  /v3.0/contacts/lookup:
    post:
      tags:
        - v3.0 > Discovery
      summary: Which of these phone numbers may the caller find
      description: >-
        AUTH_CONTRACT 7.2. Every phone lookup of the app, a shared contact
        card included. A match is left out, exactly like an unknown number,
        when its account is discoverable by `nobody`, or by `chosen` and the
        caller's own number is not on its list. At most 5,000 hashes a
        request and 20 requests a minute per account, no daily budget
        (decision 208). Checking a `chosen` account costs a scrypt: past 300
        such checks a minute per caller the rest are left out too, and the
        app asks again after its 15 minute cooldown.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneHashes]
              properties:
                phoneHashes:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                    description: SHA-256 hex of the E.164 number
      responses:
        '200':
          description: '{matches: [{phoneHash, user_id, username}]}'
        '400':
          description: BATCH_TOO_LARGE or validation_failed
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '429':
          description: RATE_LIMITED (retryAfterSec 60)
  /v3.0/users/me/discoverability:
    put:
      tags:
        - v3.0 > Discovery
      summary: Who may find this account by phone number
      description: >-
        Decision 223. `everyone`: anyone with the number. `chosen`: only the
        numbers in `phoneHashes` (the whole list each time, at most 500).
        `nobody`: only by username. An account that never chose is
        `everyone`; `GET /users/me` returns the current `discoverability`.
        The list is stored only as tokens, scrypt(user_id + phone key,
        salt PHONE_PEPPER), so it cannot be read back: the app keeps its own
        copy. Leaving `chosen` deletes the tokens. 20 saves an hour.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [everyone, chosen, nobody]
                phoneHashes:
                  type: array
                  maxItems: 500
                  description: Required with `chosen`, refused otherwise
                  items:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: '{mode, count}: count is the number of distinct entries kept'
        '400':
          description: validation_failed
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '429':
          description: RATE_LIMITED
  /v3.0/keys/me:
    put:
      summary: Register or replenish this authenticated device's public E2EE keys
      description: >-
        AUTH_CONTRACT 17. Server foundation only; client encryption is pending.
        Owner account/device come from the session. The first upload or changed
        identity creates a new UUID generation. Same-identity retries preserve
        the generation and never restore consumed prekey ids. A registration id
        stays stable per identity; signed prekey ids cannot be overwritten or
        rolled back. 60 publications per account per hour. One active phone per
        account (decision 183): a login on another phone deletes this device's
        keys, and an upload racing that login is withdrawn with a 401.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRegistration'
      responses:
        '200':
          description: Public device bundle (deviceId, generation, identityKey, registrationId, signedPreKey) plus preKeyCount
        '400':
          description: Invalid key shape, duplicate prekey ids, private or unknown fields
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '409':
          description: KEY_CONFLICT or PREKEY_CAPACITY
        '429':
          description: RATE_LIMITED
        '503':
          description: KEYS_BUSY; retry with backoff
  /v3.0/keys/{userId}:
    get:
      summary: List an account's registered public device bundles
      description: >-
        AUTH_CONTRACT 17.2. No one-time keys, internal revisions or counters
        are returned. An existing account with no keys has an empty device
        list. Reads and claims share 1000 requests/account/hour and
        2000 requests/IP/hour. Logout retains keys; account deletion purges them.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      responses:
        '200':
          description: '{devices:[{deviceId,generation,identityKey,registrationId,signedPreKey}]}'
        '400':
          description: Invalid account id
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          description: KEYS_NOT_FOUND (unknown or deleted account)
        '429':
          description: RATE_LIMITED
  /v3.0/keys/{userId}/claim:
    post:
      summary: Atomically claim one one-time prekey from a device generation
      description: >-
        AUTH_CONTRACT 17.3. Returns the public bundle and preKey:{id,publicKey},
        or preKey:null when exhausted. Clients verify signatures and identity
        trust; they never fall back to plaintext. A stale generation requires
        refetching the directory and applying the identity-trust policy.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, generation]
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 256
                generation:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Public device bundle plus preKey (object or null)
        '400':
          description: Invalid account id, device id or generation
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          description: KEYS_NOT_FOUND (unknown account, device or generation)
        '429':
          description: RATE_LIMITED
        '503':
          description: KEYS_BUSY; retry with backoff
  /v3.0/channels:
    get:
      tags:
        - v3.0 > Channels
      summary: List the caller's groups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every group the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/AuthError'
    post:
      tags:
        - v3.0 > Channels
      summary: Create a group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    channel_id:
                      type: string
                      format: uuid
                      description: Client minted, never reassigned
                    kind:
                      type: string
                      enum: [group]
                    name:
                      type: [string, 'null']
                    avatar_url:
                      type: [string, 'null']
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      description: >-
                        Must include the caller, who becomes the owner; everyone
                        else is invited (decision 221) and must be a connection
                        of the caller, else 403 `not_connected`
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [channel_id, kind, members]
      responses:
        '201':
          description: >-
            Created with the caller as its one member and the rest in
            `invited`; `ChannelCreated` to the caller, `InviteSent` to the
            invitees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '409':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags:
        - v3.0 > Channels
      summary: Get one group the caller is in
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Rename or re-avatar a group (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    name:
                      type: string
                    avatar_url:
                      type: [string, 'null']
                  anyOf:
                    - required: [name]
                    - required: [avatar_url]
      responses:
        '200':
          description: Edited; `ChannelEdited` fans out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    delete:
      tags:
        - v3.0 > Channels
      summary: Delete a group (owner) or leave it (anyone else)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Left; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '204':
          description: Deleted by the owner; `ChannelDeleted` fans out
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags:
        - v3.0 > Channels
      summary: Add members (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    members:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items:
                        $ref: '#/components/schemas/UserId'
                  required: [members]
      responses:
        '200':
          description: >-
            Invited (decision 221): `InviteSent` to the invitees and the
            members; each becomes a member, with `ChannelMemberAdded`, when
            they accept. 403 `not_connected` for someone who is not a
            connection of the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
                  invited:
                    type: array
                    description: Every pending invitee of the group
                    items:
                      $ref: '#/components/schemas/UserId'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
        '412':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - v3.0 > Channels
      summary: Remove a member (owner, admin) or leave (yourself)
      description: >-
        A leaving owner hands the group to the longest standing admin, else
        the longest standing member; the last member out deletes it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpFields'
      responses:
        '200':
          description: Removed; `ChannelMemberRemoved` fans out
          content:
            application/json:
              schema:
                type: object
                properties:
                  member_count:
                    type: integer
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
    patch:
      tags:
        - v3.0 > Channels
      summary: Promote to admin or demote to member (owner, admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OpFields'
                - type: object
                  properties:
                    role:
                      type: string
                      enum: [admin, member]
                  required: [role]
      responses:
        '200':
          description: Changed; re-announced as `ChannelMemberAdded{role}`
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    $ref: '#/components/schemas/UserId'
                  role:
                    type: string
        '403':
          $ref: '#/components/responses/ChannelWriteError'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/connections:
    get:
      tags:
        - v3.0 > Connecting
      summary: Connections, blocks and pending invites the caller can see
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            Invites to the caller (less those from someone they blocked),
            from the caller, and in the caller's groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserId'
                  blocked:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserId'
                  invites:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
  /v3.0/channels/invites:
    post:
      tags:
        - v3.0 > Connecting
      summary: Invite someone to a 1:1 chat
      description: >-
        Inviting someone who invited you accepts theirs. `InviteSent` (frame
        class INVITE, wakes) reaches the invitee, unless they blocked the
        caller: then it is kept and never shown.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  $ref: '#/components/schemas/UserId'
              required: [user_id]
      responses:
        '200':
          description: '`sent`, or `connected`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteState'
        '400':
          $ref: '#/components/responses/ChannelWriteError'
        '429':
          description: >-
            `invite_limit`: too many 1:1 invites waiting for an answer
            (default 30, `--invite-pending-max`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v3.0/channels/{channelId}/invite/accept:
    parameters:
      - name: channelId
        in: path
        required: true
        description: The group's id, or the pair's derived DM id for a 1:1 invite
        schema:
          type: string
    post:
      tags:
        - v3.0 > Connecting
      summary: Accept the caller's invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            1:1: `{state: connected}`, and `InviteAnswered` to the inviter.
            Group: the caller is a member; the group, and `ChannelMemberAdded`
            to its members
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InviteState'
                  - $ref: '#/components/schemas/Channel'
        '404':
          $ref: '#/components/responses/ChannelWriteError'
        '412':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/{channelId}/invite/decline:
    parameters:
      - name: channelId
        in: path
        required: true
        description: The group's id, or the pair's derived DM id for a 1:1 invite
        schema:
          type: string
    post:
      tags:
        - v3.0 > Connecting
      summary: Decline the caller's invite, optionally blocking the inviter
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                block:
                  type: boolean
                  description: Decline & Block
      responses:
        '200':
          description: '`{state: none}`; `InviteAnswered` to the inviter (and a group''s members)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteState'
  /v3.0/channels/{channelId}/invites/{userId}:
    parameters:
      - name: channelId
        in: path
        required: true
        description: The group's id, or the pair's derived DM id for a 1:1 invite
        schema:
          type: string
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - v3.0 > Connecting
      summary: Cancel an invite (its sender; for a group also owner, admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '`{state: none}`; `InviteAnswered` to the invitee (and a group''s members)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteState'
        '403':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/channels/blocks:
    post:
      tags:
        - v3.0 > Connecting
      summary: Block a user
      description: >-
        Their 1:1 frames to the caller are acked and dropped and their
        invites never shown. Group traffic is not affected. The connection
        stays.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  $ref: '#/components/schemas/UserId'
              required: [user_id]
      responses:
        '200':
          description: Blocked
  /v3.0/channels/blocks/{userId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags:
        - v3.0 > Connecting
      summary: Unblock a user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unblocked
  /v3.0/channels/reports:
    post:
      tags:
        - v3.0 > Connecting
      summary: Report a user
      description: >-
        Kept 90 days; the operator reads them from the database (deployment
        README, "Reports"). "Report and block" is this and `POST /blocks`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  $ref: '#/components/schemas/UserId'
                messages:
                  type: array
                  maxItems: 5
                  description: >-
                    Optional: the chat's last messages as the reporter's phone
                    shows them (the server cannot read the chat)
                  items:
                    type: object
                    properties:
                      author:
                        $ref: '#/components/schemas/UserId'
                      body:
                        type: string
                        maxLength: 4096
                      content_type:
                        type: string
                      sent_at:
                        type: integer
                        description: ms since epoch
                    required: [author, body]
              required: [user_id]
      responses:
        '201':
          description: Filed
        '400':
          $ref: '#/components/responses/ChannelWriteError'
  /v3.0/sync/pending:
    get:
      tags:
        - v3.0 > Sync
      summary: Read the caller's timeline from this device's pointer
      description: >-
        Every `Envelope` fanned out to the calling user is kept once on the
        server, pushed live or not, until it expires: its sender's
        `ttl_sec`, at most and by default 30 days (a receipt 7). This returns
        the unexpired ones naming this user with a `server_timestamp_ms` at or after
        `since`, oldest first (then by `op_id`), up to 500, leaving out what
        this very device sent. It removes nothing and remembers nothing: the
        device keeps the newest `server_timestamp_ms` it has handled and
        passes it as `since` next time; the frames at that millisecond come
        back and the client's `op_id` dedup absorbs them. The timeline
        survives server restarts. Clients order what they receive by
        (`server_timestamp_ms`, `op_id`).
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: The device's pointer, a server_timestamp_ms, inclusive; 0 or absent reads everything kept
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: >-
            A serialized `PendingPage` (proto/v3-envelope.proto, decision
            218): the envelopes from the pointer on, each exactly as a
            WS_PUSH carries it, and `more` when more wait past this page
            (pull again from its last server_timestamp_ms). Zero bytes when
            there are none.
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
        '400':
          description: '`since` is not a non-negative integer'
        '401':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/vapid:
    get:
      tags:
        - v3.0 > Push
      summary: Get the server VAPID public key
      description: >-
        The key the client passes to its UnifiedPush distributor, so the
        distributor accepts only pushes signed by this server. A changed key
        means the client re-registers with its distributor and re-posts
        `/v3.0/push/topic`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey:
                    type: string
                    description: Uncompressed P-256 point, base64url without padding (87 chars)
                    example: BCkGhRTonSgzpIq9SrkFnnsNHs_HsBiTun0IHDO7tzVdPx7WXt_2BueoMz9azMG0lB_UVBWFmkgTO6yc-T0UiCA
                required: [vapidPublicKey]
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v3.0/push/topic:
    post:
      tags:
        - v3.0 > Push
      summary: Register, replace or deregister the device push endpoint
      description: >-
        One endpoint per `(user_id, deviceId)`; a registration replaces the
        previous one. `endpoint` null or empty deregisters (keys ignored).
        Logout, account deletion, phone rebind and a 404/410 from the push
        service deregister implicitly (AUTH_CONTRACT 5.2).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: [string, 'null']
                  maxLength: 2048
                  description: >-
                    The UnifiedPush endpoint. https, no userinfo, and a host
                    that resolves only to public unicast addresses.
                  example: https://ntfy.sh/upAbC123
                p256dh:
                  type: string
                  description: Device ECDH public key, uncompressed P-256 point (65 bytes), base64url
                  example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
                auth:
                  type: string
                  description: Device auth secret (16 bytes), base64url
                  example: tBHItJI5svbpez7KI4CCXg
              required: [endpoint]
      responses:
        '200':
          description: Registered, replaced or deregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: >-
            `INVALID_PUSH_ENDPOINT`: not https, over 2048 chars, has userinfo,
            or resolves to a non public address. `INVALID_PUSH_KEYS`: `p256dh`
            or `auth` missing or malformed. `validation_failed`: `endpoint`
            absent or not a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                endpoint:
                  value:
                    error:
                      code: INVALID_PUSH_ENDPOINT
                      message: endpoint must be an https url on a public host
                keys:
                  value:
                    error:
                      code: INVALID_PUSH_KEYS
                      message: p256dh must be a 65 byte P-256 point and auth 16 bytes, base64url
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /v3.0/timeline/posts:
    post:
      tags:
        - v3.0 > Timeline
      summary: Post to the timeline
      description: >-
        The audience must be people the poster is connected to (decision
        219), with no block either way; others are dropped and the stored
        audience is returned. A
        retry with the same `postId` returns the stored post (200). 10 posts
        per user per hour and 30 per day (`--timeline-post-hour`,
        `--timeline-post-day`). Upload photos first through
        `/v3.0/assets` with category `timeline`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [postId, audience]
              properties:
                postId:
                  type: string
                  format: uuid
                  description: Minted by the phone, so a retry is idempotent
                text:
                  type: [string, 'null']
                  maxLength: 2000
                photos:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/TimelinePhoto'
                audience:
                  type: array
                  minItems: 1
                  maxItems: 256
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/UserId'
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnTimelinePost'
        '200':
          description: A retry of a post already stored
        '400':
          description: EMPTY_POST (no text and no photo), or validation_failed
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          description: NOT_CONNECTED (nobody in the audience is), or USERNAME_REQUIRED
        '409':
          description: POST_EXISTS (another user's post has that id)
        '429':
          description: RATE_LIMITED
  /v3.0/timeline/feed:
    get:
      tags:
        - v3.0 > Timeline
      summary: The posts shared with the caller, newest first
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before
          schema:
            type: string
          description: The previous page's `next`
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: '`{posts: TimelinePost[], next}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/AuthError'
  /v3.0/timeline/posts/mine:
    get:
      tags:
        - v3.0 > Timeline
      summary: The caller's own posts, newest first, with who reacted
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: '`{posts: OwnTimelinePost[], next}`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/AuthError'
  /v3.0/timeline/posts/{postId}:
    delete:
      tags:
        - v3.0 > Timeline
      summary: Delete one of the caller's posts, and its photos
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: POST_NOT_FOUND (none, or not the caller's)
  /v3.0/timeline/posts/{postId}/reaction:
    put:
      tags:
        - v3.0 > Timeline
      summary: Set the caller's one reaction to a post shared with them
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
                  maxLength: 16
      responses:
        '204':
          description: Set; replaces the caller's earlier one
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: POST_NOT_FOUND (none, or the caller is not in its audience)
    delete:
      tags:
        - v3.0 > Timeline
      summary: Take the caller's reaction back
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Gone
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: POST_NOT_FOUND
  /v3.0/timeline/posts/{postId}/reactions:
    get:
      tags:
        - v3.0 > Timeline
      summary: Who reacted to one of the caller's posts (poster only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: '`{reactions: TimelineReaction[]}`, oldest first'
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: POST_NOT_FOUND (none, or not the caller's)
  /v1.0/assets/upload/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Generate Presigned URL for upload
      parameters:
        - name: ext
          in: query
          schema:
            type: string
          example: .png
        - name: category
          in: query
          schema:
            type: string
          example: chat
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/download/{assetId}/presigned_url:
    get:
      tags:
        - v1.0 > Assets
      summary: Get Presigned Url to download assets
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /v1.0/assets/{assetId}/status:
    put:
      tags:
        - v1.0 > Assets
      summary: Update Asset Status
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                status: true
      parameters:
        - name: assetId
          in: path
          schema:
            type: string
          required: true
          example: e3dbe14f-c8da-4436-b912-da059098c6a5
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
