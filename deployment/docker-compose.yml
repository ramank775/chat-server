# The microservice layout (decision 191): one container per service behind
# nginx, which runs the `/auth` subrequest the monolith does in process. Use
# it together with docker-compose.infra.yml:
#   docker compose -p <name> --env-file .env.tmpl -f docker-compose.infra.yml -f docker-compose.yml up -d
# The event bus is NATS (EVENT_STORE=nats) or Kafka (EVENT_STORE=kafka plus
# `--profile kafka`). Production 3.0 is the monolith (docker-compose.prod.yml).
x-secrets: &profile-secrets
  # Both may stay empty only with SMS_SENDER=mock (README, Phone pepper).
  # Every profile instance needs the same values.
  OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:-}
  PHONE_PEPPER: ${PHONE_PEPPER:-}

services:
  nginx:
    image: nginx:stable
    volumes:
      - ${CONFIG_DIR}/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      # the routes, shared with the helm chart
      - ./helm/files/nginx-routes.conf:/etc/nginx/routes.conf:ro

  ws-gateway:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    entrypoint: node
    command: >-
      /app/services/connection-gateway/ws-gateway.js --app-name=ws-gateway --host=0.0.0.0 --port=8000
      --gateway-name=${GATEWAY_NAME:-ws-gateway-1}
      --new-message-topic=${TOPIC_NEW_MESSAGE} --offline-message-topic=${TOPIC_OFFLINE_MESSAGE}
      --event-store=${EVENT_STORE}
      --kafka-client-id=${GATEWAY_CLIENT_ID:-gateway-1} --kafka-consumer-group=${CONSUMER_GROUP_GATEWAY}
      --kafka-broker-list=${BROKER_LIST} --kafka-security-protocol=${KAFKA_SECURITY_PROTOCOL}
      --kafka-sasl-username=${KAFKA_SASL_USERNAME} --kafka-sasl-password=${KAFKA_SASL_PASSWORD}
      --nats-server-list=${NATS_SERVER_LIST} --nats-auth-type=${NATS_AUTH} --nats-auth-user=${NATS_USER}
      --nats-auth-pass=${NATS_PASS} --nats-auth-token=${NATS_AUTH_TOKEN} --nats-auth-nkey=${NATS_NKEY}
      --nats-auth-jwt=${NATS_USER_JWT} --nats-consumer-group=${CONSUMER_GROUP_GATEWAY}
      --cache-type=redis --redis-endpoint=${REDIS_ENDPOINT} --channel-ms-endpoint=http://channel:4002
      --profile-ms-endpoint=http://profile:4000
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  message-delivery:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    entrypoint: node
    command: >-
      /app/services/message-delivery/message-delivery-worker.js --app-name=message-delivery
      --new-message-topic=${TOPIC_NEW_MESSAGE} --offline-message-topic=${TOPIC_OFFLINE_MESSAGE}
      --event-store=${EVENT_STORE}
      --kafka-client-id=${MESSAGE_DELIVERY_CLIENT_ID:-message-delivery-1}
      --kafka-consumer-group=${CONSUMER_GROUP_MESSAGE_DELIVERY}
      --kafka-broker-list=${BROKER_LIST} --kafka-security-protocol=${KAFKA_SECURITY_PROTOCOL}
      --kafka-sasl-username=${KAFKA_SASL_USERNAME} --kafka-sasl-password=${KAFKA_SASL_PASSWORD}
      --nats-server-list=${NATS_SERVER_LIST} --nats-auth-type=${NATS_AUTH} --nats-auth-user=${NATS_USER}
      --nats-auth-pass=${NATS_PASS} --nats-auth-token=${NATS_AUTH_TOKEN} --nats-auth-nkey=${NATS_NKEY}
      --nats-auth-jwt=${NATS_USER_JWT} --nats-consumer-group=${CONSUMER_GROUP_MESSAGE_DELIVERY}
      --redis-endpoint=${REDIS_ENDPOINT} --channel-ms-endpoint=http://channel:4002
      --profile-ms-endpoint=http://profile:4000
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --undelivered-queue=${DB_BACKEND:-mongo} --pg-url=${PG_URL}

  message:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    entrypoint: node
    command: >-
      /app/services/message-ms/message-ms.js --app-name=message-ms --host=0.0.0.0 --port=4003
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --undelivered-queue=${DB_BACKEND:-mongo} --pg-url=${PG_URL}
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  channel:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    entrypoint: node
    command: >-
      /app/services/channel-ms/channel-ms.js --app-name=channel-ms --host=0.0.0.0 --port=4002
      --cache-type=redis --redis-endpoint=${REDIS_ENDPOINT} --new-message-topic=${TOPIC_NEW_MESSAGE}
      --media-ms-endpoint=http://media-metadata-ms:4001
      --event-store=${EVENT_STORE} --kafka-client-id=${GROUP_CLIENT_ID:-group-1}
      --kafka-broker-list=${BROKER_LIST} --kafka-security-protocol=${KAFKA_SECURITY_PROTOCOL}
      --kafka-sasl-username=${KAFKA_SASL_USERNAME} --kafka-sasl-password=${KAFKA_SASL_PASSWORD}
      --nats-server-list=${NATS_SERVER_LIST} --nats-auth-type=${NATS_AUTH} --nats-auth-user=${NATS_USER}
      --nats-auth-pass=${NATS_PASS} --nats-auth-token=${NATS_AUTH_TOKEN} --nats-auth-nkey=${NATS_NKEY}
      --nats-auth-jwt=${NATS_USER_JWT}
      --channel-db=${DB_BACKEND:-mongo} --pg-url=${PG_URL}
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  profile:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    environment: *profile-secrets
    entrypoint: node
    command: >-
      /app/services/profile-ms/profile-ms.js --app-name=profile-ms --host=0.0.0.0 --port=4000
      --new-message-topic=${TOPIC_NEW_MESSAGE} --channel-ms-endpoint=http://channel:4002
      --gateway-endpoint=http://ws-gateway:8000 --notification-ms-endpoint=http://notification:4004
      --media-ms-endpoint=http://media-metadata-ms:4001
      --auth-provider=${AUTH_PROVIDER:-self-hosted-otp} ${PROFILE_DEV_FLAGS}
      --sms-sender=${SMS_SENDER:-mock} --sms-gate-url=${SMS_GATE_URL} --sms-gate-user=${SMS_GATE_USER}
      --sms-gate-password=${SMS_GATE_PASSWORD}
      --telegram-bot-token=${TELEGRAM_BOT_TOKEN:-} --telegram-chat-id=${TELEGRAM_CHAT_ID:-}
      --cache-type=redis --redis-endpoint=${REDIS_ENDPOINT}
      --event-store=${EVENT_STORE} --kafka-client-id=${PROFILE_CLIENT_ID:-profile-1}
      --kafka-broker-list=${BROKER_LIST} --kafka-security-protocol=${KAFKA_SECURITY_PROTOCOL}
      --kafka-sasl-username=${KAFKA_SASL_USERNAME} --kafka-sasl-password=${KAFKA_SASL_PASSWORD}
      --nats-server-list=${NATS_SERVER_LIST} --nats-auth-type=${NATS_AUTH} --nats-auth-user=${NATS_USER}
      --nats-auth-pass=${NATS_PASS} --nats-auth-token=${NATS_AUTH_TOKEN} --nats-auth-nkey=${NATS_NKEY}
      --nats-auth-jwt=${NATS_USER_JWT}
      --auth-db=${DB_BACKEND:-mongo} --profile-db=${DB_BACKEND:-mongo} --pg-url=${PG_URL}
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  notification:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    environment:
      # decision 209: Play builds' push; empty = no push for them
      FCM_SERVICE_ACCOUNT_KEY: ${FCM_SERVICE_ACCOUNT_KEY:-}
    entrypoint: node
    command: >-
      /app/services/notification-ms/notification-ms.js --app-name=notification-ms --host=0.0.0.0 --port=4004
      --offline-message-topic=${TOPIC_OFFLINE_MESSAGE}
      --notification-db=${DB_BACKEND:-mongo} --pg-url=${PG_URL}
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --pn-service=${PN_SERVICE:-webpush} --vapid-public-key=${VAPID_PUBLIC_KEY}
      --vapid-private-key=${VAPID_PRIVATE_KEY} --vapid-subject=${VAPID_SUBJECT} ${PUSH_DEV_FLAGS}
      --event-store=${EVENT_STORE} --kafka-consumer-group=${CONSUMER_GROUP_NOTIFICATION}
      --kafka-client-id=${NOTIFICATION_CLIENT_ID:-notification-1}
      --kafka-broker-list=${BROKER_LIST} --kafka-security-protocol=${KAFKA_SECURITY_PROTOCOL}
      --kafka-sasl-username=${KAFKA_SASL_USERNAME} --kafka-sasl-password=${KAFKA_SASL_PASSWORD}
      --nats-server-list=${NATS_SERVER_LIST} --nats-auth-type=${NATS_AUTH} --nats-auth-user=${NATS_USER}
      --nats-auth-pass=${NATS_PASS} --nats-auth-token=${NATS_AUTH_TOKEN} --nats-auth-nkey=${NATS_NKEY}
      --nats-auth-jwt=${NATS_USER_JWT} --nats-consumer-group=${CONSUMER_GROUP_NOTIFICATION}
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  media-metadata-ms:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    entrypoint: node
    command: >-
      /app/services/media-ms/media-metadata-ms.js --app-name=media-metadata-ms --host=0.0.0.0 --port=4001
      --media-metadata-db=${DB_BACKEND:-mongo} --pg-url=${PG_URL}
      --mongo-url=${MONGO_URL} --mongo-user=${MONGO_USER} --mongo-password=${MONGO_PASSWORD} --mongo-auth
      --media-storage=s3 --s3-bucket-name=${S3_BUCKET_NAME} --s3-secret-access-key=${S3_SECRET_ACCESS_KEY}
      --s3-access-key-id=${S3_ACCESS_KEY_ID} --s3-region=${S3_REGION:-ap-south-1}
      --s3-endpoint=${S3_ENDPOINT} --s3-internal-endpoint=${S3_INTERNAL_ENDPOINT:-} --s3-force-path-style
      --base-upload-dir=/dev --url-expire-time=${URL_EXPIRE_TIME:-3600}
      --max-upload-size=${MAX_UPLOAD_SIZE:-26214400}
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}
