# The routes in front of the services, shared by the compose stack
# (config/nginx/nginx.docker.conf includes it) and the helm chart
# (templates/nginx.yaml): each sets $connection_gateway, $profile_ms,
# $media_ms, $channel_ms, $message_ms and $notification_ms first.

# identity subrequest: exact match so /auth/otp/* and /auth/session/* route below
location = /auth {
  internal;

  proxy_pass http://$profile_ms;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  # never let a client supply its own identity
  proxy_set_header x-user "";
  proxy_set_header x-device "";
}

rewrite /v1.0/(.*) /$1;
rewrite /v3.0/(.*) /$1;

# AUTH_CONTRACT 11: an auth_request rejection is an nginx-generated 401/403
# with an html body, which loses the error envelope the client parses. Re-run
# the same subrequest in a named location so profile-ms' body and status are
# what the client sees (USERNAME_REQUIRED, INVALID_ACCESSKEY, ...).
# Upstream 401/403s are untouched: proxy_intercept_errors stays off.
error_page 401 403 = @auth_error;
location @auth_error {
  rewrite ^ /auth break;

  proxy_pass http://$profile_ms;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header x-user "";
  proxy_set_header x-device "";
}

# AUTH_CONTRACT 3 and 4: unauthenticated, the client has no accesskey yet
location ~* ^/auth/ {
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_pass http://$profile_ms;
}


location ~* ^/wss {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  rewrite ^(i|/)?/wss(/|$)(.*)$ /$3 break;
  proxy_pass http://$connection_gateway;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
}

# SYNC_PROTOCOL.md §10.6 — undelivered-queue drain.
location ~* ^/sync {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  rewrite ^/sync(/|$)(.*)$ /$2 break;
  proxy_pass http://$message_ms;
}

location ~* ^/(users|contacts|keys|timeline) {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_pass http://$profile_ms;
}

location ~* ^/channels {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  add_header X-match-uri "/channels";
  add_header X-uri $1;

  rewrite ^(i|/)?/channels(/|$)(.*)$ /$3 break;
  proxy_pass http://$channel_ms;
}

location ~* ^/assets {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  
  add_header X-match-uri "/assets";
  add_header X-uri $1;

  rewrite ^(i|/)?/assets(/|$)(.*)$ /$3 break;
  proxy_pass http://$media_ms;
}

location ~* ^/push {
  auth_request /auth;
  auth_request_set $x_user $upstream_http_x_user;
  auth_request_set $x_device $upstream_http_x_device;
  proxy_set_header x-user $x_user;
  proxy_set_header x-device $x_device;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  add_header X-match-uri "/push";
  add_header X-uri $1;

  rewrite ^(i|/)?/push(/|$)(.*)$ /$3 break;
  proxy_pass http://$notification_ms;
}
