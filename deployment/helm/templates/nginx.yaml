{{- /*
nginx in front of the services, as in compose: the same routes
(files/nginx-routes.conf) with each service's cluster dns name. The
upstreams are variables so a service's new address is picked up, which
needs a resolver and full names (nginx's resolver ignores search domains).
*/ -}}
{{- $ns := printf "%s.svc.%s" .Release.Namespace .Values.nginx.clusterDomain }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  labels:
    {{- include "chatserver.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    pid /tmp/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      resolver {{ .Values.nginx.resolver }} valid=10s;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 80 default_server;
        server_name _;
        set $connection_gateway ws-gateway.{{ $ns }}:8000;
        set $profile_ms profile.{{ $ns }}:4000;
        set $media_ms media-metadata-ms.{{ $ns }}:4001;
        set $channel_ms channel.{{ $ns }}:4002;
        set $message_ms message.{{ $ns }}:4003;
        set $notification_ms notification.{{ $ns }}:4004;
        include /etc/nginx/routes.conf;
      }
    }
  routes.conf: |
    {{- .Files.Get "files/nginx-routes.conf" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    {{- include "chatserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatserver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "chatserver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      containers:
        - name: nginx
          image: {{ .Values.nginx.image }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: config
              mountPath: /etc/nginx/routes.conf
              subPath: routes.conf
      volumes:
        - name: config
          configMap:
            name: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    {{- include "chatserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    {{- include "chatserver.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
