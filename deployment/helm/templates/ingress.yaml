{{- if .Values.ingress.enabled }}
# Everything goes to nginx, which routes and authenticates. Raise the proxy
# read timeout for /wss on your ingress controller: the socket stays open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chatserver.name" . }}
  labels:
    {{- include "chatserver.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
{{- end }}
