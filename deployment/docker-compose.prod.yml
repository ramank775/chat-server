# Production: the monolith (decision 170) behind Caddy, which gets and renews
# the TLS certificate and is the only thing on the internet. Media lives in a
# Cloudflare R2 bucket: the server only signs upload/download urls, phones
# talk to R2 directly. Mongo holds everything else, the timeline included.
# Settings come from `.env` (copy .env.prod.tmpl); see README.md.
name: vartalap

x-logging: &logging
  options:
    max-size: "50m"
    max-file: "5"

volumes:
  mongo-data:
  caddy-data:
  caddy-config:

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # No published port: the per-IP OTP limits trust the last X-Forwarded-For
  # hop, which only Caddy may write.
  app:
    environment:
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:?set OTP_ENCRYPTION_KEY in .env}
    image: ramank775/chatserver:${CHAT_SERVER_TAG:?set CHAT_SERVER_TAG in .env}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    logging: *logging
    entrypoint: node
    command: >-
      /app/services/monolith.js --app-name=monolith --host=0.0.0.0 --port=8000
      --mongo-url=mongodb://mongo:27017/chat?authSource=admin --mongo-auth
      --mongo-user=${MONGO_USER:?set MONGO_USER in .env}
      --mongo-password=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      --sms-sender=sms-gate-app --sms-gate-url=${SMS_GATE_URL:-https://api.sms-gate.app}
      --sms-gate-user=${SMS_GATE_USER:?set SMS_GATE_USER in .env}
      --sms-gate-password=${SMS_GATE_PASSWORD:?set SMS_GATE_PASSWORD in .env}
      --pn-service=webpush
      --vapid-public-key=${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      --vapid-private-key=${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      --vapid-subject=${VAPID_SUBJECT:?set VAPID_SUBJECT in .env}
      --media-storage=s3 --s3-region=auto --s3-force-path-style
      --s3-endpoint=${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      --s3-bucket-name=${S3_BUCKET_NAME:?set S3_BUCKET_NAME in .env}
      --s3-access-key-id=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      --s3-secret-access-key=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      --base-upload-dir=media --url-expire-time=3600 --max-upload-size=26214400
      --new-message-topic=new-message --offline-message-topic=offline-message
      --gateway-name=monolith-gateway

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=chat
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
