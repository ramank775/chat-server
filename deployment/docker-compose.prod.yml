# Production: the monolith (decision 170) behind the host's nginx, or behind
# Caddy (COMPOSE_PROFILES=caddy), which gets and renews the TLS certificate.
# Either way the proxy is the only thing on the internet. Media lives in a
# Cloudflare R2 bucket: the server only signs upload/download urls, phones
# talk to R2 directly. Postgres holds everything else, the timeline included
# (decision 206).
# Settings come from `.env` (copy .env.prod.tmpl); see README.md.
name: vartalap

x-logging: &logging
  options:
    max-size: "50m"
    max-file: "5"

volumes:
  pg-data:
  caddy-data:
  caddy-config:

services:
  # Only with COMPOSE_PROFILES=caddy: on a server where nothing else owns
  # 80/443. Behind the host's own nginx, leave it off (config/nginx/vartalap-host.conf).
  caddy:
    profiles: ["caddy"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # Published on the host's loopback only, for its nginx: the per-IP OTP
  # limits trust the last X-Forwarded-For hop, which only the proxy may write.
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      OTP_ENCRYPTION_KEY: ${OTP_ENCRYPTION_KEY:?set OTP_ENCRYPTION_KEY in .env}
      # decision 223: never change it once users exist (README, Phone pepper)
      PHONE_PEPPER: ${PHONE_PEPPER:?set PHONE_PEPPER in .env}
      # decision 209: Play builds' push; empty = no push for them
      FCM_SERVICE_ACCOUNT_KEY: ${FCM_SERVICE_ACCOUNT_KEY:-}
    image: ramank775/chatserver:${CHAT_SERVER_TAG:?set CHAT_SERVER_TAG in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    entrypoint: node
    command: >-
      /app/services/monolith.js --app-name=monolith --host=0.0.0.0 --port=8000
      --pg-url=postgres://${PG_USER:?set PG_USER in .env}:${PG_PASSWORD:?set PG_PASSWORD in .env}@postgres:5432/chat
      --profile-db=pg --auth-db=pg --channel-db=pg --notification-db=pg
      --media-metadata-db=pg --undelivered-queue=pg
      --sms-sender=${SMS_SENDER:-sms-gate-app} --sms-gate-url=${SMS_GATE_URL:-https://api.sms-gate.app}
      --sms-gate-user=${SMS_GATE_USER:-} --sms-gate-password=${SMS_GATE_PASSWORD:-}
      --telegram-bot-token=${TELEGRAM_BOT_TOKEN:-} --telegram-chat-id=${TELEGRAM_CHAT_ID:-}
      --pn-service=webpush
      --vapid-public-key=${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      --vapid-private-key=${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      --vapid-subject=${VAPID_SUBJECT:?set VAPID_SUBJECT in .env}
      --media-storage=s3 --s3-region=auto --s3-force-path-style
      --s3-endpoint=${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      --s3-bucket-name=${S3_BUCKET_NAME:?set S3_BUCKET_NAME in .env}
      --s3-access-key-id=${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      --s3-secret-access-key=${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      --base-upload-dir=media --url-expire-time=3600 --max-upload-size=26214400
      --new-message-topic=new-message --offline-message-topic=offline-message
      --gateway-name=monolith-gateway
      --min-app-build=${MIN_APP_BUILD:-85} --latest-app-build=${LATEST_APP_BUILD:-0}

  # WAL settings per decision 129: the timeline is append-only day partitions.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c wal_compression=lz4 -c checkpoint_timeout=15min -c max_wal_size=4GB
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d chat"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
