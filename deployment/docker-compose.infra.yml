networks:
  vartalap:

volumes:
  nats-data:
  mongo-data:
  kafka-data:

services:
  nats:
    image: nats:2.10-alpine3.18
    command: nats-server -c /config/nats.conf
    volumes:
      - ./config/nats:/config
      - nats-data:/data
    networks:
      - vartalap

  kafka:
    image: bitnami/kafka:latest
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka-data:/bitnami/kafka/data
    networks:
      - vartalap

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=chat
    networks:
      - vartalap

  nginx:
    image: nginx:stable
    ports:
      - "8081:80"
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    logging:
      options:
        max-size: "50m"
    networks:
      - vartalap

  ws-gateway:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  message-delivery:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  message:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  channel:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  profile:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  notification:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  media-metadata-ms:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
