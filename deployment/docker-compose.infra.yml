networks:
  vartalap:

volumes:
  nats-data:
  mongo-data:
  pg-data:
  kafka-data:
  minio-data:
  ntfy-data:

services:
  nats:
    image: nats:2.10-alpine3.18
    command: nats-server -c /config/nats.conf
    volumes:
      - ./config/nats:/config
      - nats-data:/data
    networks:
      - vartalap

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    entrypoint:
      - /bin/sh
      - -c
      - |
        until nats --server nats://nats:4222 stream ls >/dev/null 2>&1; do sleep 1; done
        for topic in ${TOPIC_NEW_MESSAGE} ${TOPIC_OFFLINE_MESSAGE}; do
          nats --server nats://nats:4222 stream add "$$topic" --subjects "$$topic.>" --storage file --replicas 1 \
            --retention limits --discard old --max-msgs=-1 --max-msgs-per-subject=-1 --max-bytes=-1 \
            --max-age=-1 --max-msg-size=-1 --dupe-window 2m --allow-rollup --no-deny-delete --no-deny-purge \
            --defaults || true
        done
    networks:
      - vartalap

  # EVENT_STORE=kafka only: `--profile kafka`. The Apache project's own image
  # (Bitnami's was withdrawn), one KRaft node.
  kafka:
    image: apache/kafka:4.4.0
    profiles:
      - kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - vartalap

  # the services never create topics (allowAutoTopicCreation is off)
  kafka-init:
    image: apache/kafka:4.4.0
    profiles:
      - kafka
    depends_on:
      - kafka
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 1; done
        for topic in ${TOPIC_NEW_MESSAGE} ${TOPIC_OFFLINE_MESSAGE}; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done
    networks:
      - vartalap

  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=chat
    networks:
      - vartalap

  # the pg backend (--*-db=pg, --undelivered-queue=pg), off unless asked for:
  # `--profile pg`, or name the service. WAL settings per DECISIONS row 129.
  postgres:
    image: postgres:17-alpine
    profiles:
      - pg
    command: postgres -c wal_compression=lz4 -c checkpoint_timeout=15min -c max_wal_size=4GB
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d chat"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - vartalap

  # MinIO stopped publishing images in late 2025; pgsty/minio is a maintained
  # build of the same server (and mc). MINIO_IMAGE picks another.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - vartalap

  minio-init:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    depends_on:
      - minio
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY; do sleep 1; done &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "
    networks:
      - vartalap

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    volumes:
      - ntfy-data:/var/cache/ntfy
    networks:
      - vartalap

  nginx:
    image: nginx:stable
    ports:
      - "${NGINX_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"

  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT:-6379}:6379"
    logging:
      options:
        max-size: "50m"
    networks:
      - vartalap

  ws-gateway:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: &app-depends
      nats-init:
        condition: service_completed_successfully
      # only there under `--profile kafka` / `--profile pg`
      kafka-init:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
        required: false
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  message-delivery:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  message:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  channel:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  profile:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  notification:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  media-metadata-ms:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on: *app-depends
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
