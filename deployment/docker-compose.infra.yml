networks:
  vartalap:

volumes:
  nats-data:
  mongo-data:
  kafka-data:
  minio-data:
  ntfy-data:

services:
  nats:
    image: nats:2.10-alpine3.18
    command: nats-server -c /config/nats.conf
    volumes:
      - ./config/nats:/config
      - nats-data:/data
    networks:
      - vartalap

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    entrypoint:
      - /bin/sh
      - -c
      - |
        until nats --server nats://nats:4222 stream ls >/dev/null 2>&1; do sleep 1; done
        for topic in ${TOPIC_NEW_MESSAGE} ${TOPIC_OFFLINE_MESSAGE} ${TOPIC_NEW_LOGIN} ${TOPIC_CLIENT_ACK_MESSAGE}; do
          nats --server nats://nats:4222 stream add "$$topic" --subjects "$$topic.>" --storage file --replicas 1 \
            --retention limits --discard old --max-msgs=-1 --max-msgs-per-subject=-1 --max-bytes=-1 \
            --max-age=-1 --max-msg-size=-1 --dupe-window 2m --allow-rollup --no-deny-delete --no-deny-purge \
            --defaults || true
        done
    networks:
      - vartalap

  kafka:
    image: bitnami/kafka:3.9
    profiles:
      - kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka-data:/bitnami/kafka/data
    networks:
      - vartalap

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=chat
    networks:
      - vartalap

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    networks:
      - vartalap

  minio-init:
    image: minio/minio:latest
    depends_on:
      - minio
    environment:
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY; do sleep 1; done &&
      mc mb --ignore-existing local/$$S3_BUCKET_NAME
      "
    networks:
      - vartalap

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    volumes:
      - ntfy-data:/var/cache/ntfy
    networks:
      - vartalap

  nginx:
    image: nginx:stable
    ports:
      - "${NGINX_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    logging:
      options:
        max-size: "50m"
    networks:
      - vartalap

  ws-gateway:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
    depends_on:
      nats-init:
        condition: service_completed_successfully
    networks:
      - vartalap
    logging:
      options:
        max-size: "100m"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  message-delivery:
    image: ramank775/chatserver:${CHAT_SERVER_TAG}
    restart: unless-stopped
