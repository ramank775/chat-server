# Host nginx in front of docker-compose.prod.yml, whose app listens on
# 127.0.0.1:8000 only (APP_PORT in .env; change proxy_pass to match).
# Written for vartalapapp.one9x.com behind the Cloudflare proxy (orange
# cloud), with the origin certificate already on the server. Remove any
# other site with this server_name, copy this to
# /etc/nginx/sites-available/vartalap, link it into sites-enabled, then
# `sudo nginx -t && sudo systemctl reload nginx`.
# Without the Cloudflare proxy: drop the set_real_ip_from/real_ip_header
# lines and get a certificate with `sudo certbot --nginx -d <host>`.
map $http_upgrade $vartalap_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name vartalapapp.one9x.com;
    ssl_certificate /etc/nginx/cert/one9x.crt;
    ssl_certificate_key /etc/nginx/cert/one9x.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every request arrives from a Cloudflare edge. The per-IP OTP limits
    # need the client, so take CF-Connecting-IP, but only from Cloudflare's
    # ranges (https://www.cloudflare.com/ips/, copied 2026-11-01).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # the app refuses these from outside the container too
    location /_internal { return 404; }

    # The socket (/wss) upgrades here; the server pings every 30 s, inside
    # nginx's 60 s and Cloudflare's 100 s idle timeouts.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # one hop, the real client: the per-IP OTP limits read the last one
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vartalap_connection_upgrade;
    }
}
