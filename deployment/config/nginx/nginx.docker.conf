# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
  worker_connections 1024;
}

http {
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  types_hash_max_size 2048;

  include             /etc/nginx/mime.types;
  default_type        application/octet-stream;

  # NOT /etc/nginx/conf.d/*.conf: the nginx image ships a default.conf whose
  # `server_name localhost` beats this block's `server_name _` for every local
  # request, so every route 404'd on the stock static root.

  # docker's embedded dns, so a restarted service is picked up without
  # restarting nginx (the variables in proxy_pass below force re-resolution).
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }


  
  



  server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /usr/share/nginx/html;

    set $connection_gateway ws-gateway:8000;
    set $profile_ms profile:4000;
    set $media_ms media-metadata-ms:4001;
    set $channel_ms channel:4002;
    set $message_ms message:4003;
    set $notification_ms notification:4004;

    # identity subrequest: exact match so /auth/otp/* and /auth/session/* route below
    location = /auth {
      internal;

      proxy_pass http://$profile_ms;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      # never let a client supply its own identity
      proxy_set_header x-user "";
      proxy_set_header x-device "";
    }

    rewrite /v1.0/(.*) /$1;
    rewrite /v3.0/(.*) /$1;

    # AUTH_CONTRACT 11: an auth_request rejection is an nginx-generated 401/403
    # with an html body, which loses the error envelope the client parses. Re-run
    # the same subrequest in a named location so profile-ms' body and status are
    # what the client sees (USERNAME_REQUIRED, INVALID_ACCESSKEY, ...).
    # Upstream 401/403s are untouched: proxy_intercept_errors stays off.
    error_page 401 403 = @auth_error;
    location @auth_error {
      rewrite ^ /auth break;

      proxy_pass http://$profile_ms;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header x-user "";
      proxy_set_header x-device "";
    }

    # AUTH_CONTRACT 3 and 4: unauthenticated, the client has no accesskey yet
    location ~* ^/auth/ {
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$profile_ms;
    }


    location ~* ^/wss {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      rewrite ^(i|/)?/wss(/|$)(.*)$ /$3 break;
      proxy_pass http://$connection_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    location ~* ^/messages {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      rewrite ^(i|/)?/messages(/|$)(.*)$ /$3 break;
      proxy_pass http://$message_ms;
    }

    # SYNC_PROTOCOL.md §10.6 — undelivered-queue drain.
    location ~* ^/sync {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      rewrite ^/sync(/|$)(.*)$ /$2 break;
      proxy_pass http://$message_ms;
    }

    location ~* ^/(users|contacts) {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$profile_ms;
    }

    location ~* ^/channels {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      add_header X-match-uri "/channels";
      add_header X-uri $1;

      rewrite ^(i|/)?/channels(/|$)(.*)$ /$3 break;
      proxy_pass http://$channel_ms;
    }

    location ~* ^/assets {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      
      add_header X-match-uri "/assets";
      add_header X-uri $1;

      rewrite ^(i|/)?/assets(/|$)(.*)$ /$3 break;
      proxy_pass http://$media_ms;
    }

    location ~* ^/push {
      auth_request /auth;
      auth_request_set $x_user $upstream_http_x_user;
      auth_request_set $x_device $upstream_http_x_device;
      proxy_set_header x-user $x_user;
      proxy_set_header x-device $x_device;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      add_header X-match-uri "/push";
      add_header X-uri $1;

      rewrite ^(i|/)?/push(/|$)(.*)$ /$3 break;
      proxy_pass http://$notification_ms;
    }

    error_page 404 /404.html;
      location = /40x.html {
    }

    error_page 500 502 503 504 /50x.html;
      location = /50x.html {
    }
  }
}
