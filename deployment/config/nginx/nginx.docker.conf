# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
  worker_connections 1024;
}

http {
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  types_hash_max_size 2048;

  include             /etc/nginx/mime.types;
  default_type        application/octet-stream;

  # NOT /etc/nginx/conf.d/*.conf: the nginx image ships a default.conf whose
  # `server_name localhost` beats this block's `server_name _` for every local
  # request, so every route 404'd on the stock static root.

  # docker's embedded dns, so a restarted service is picked up without
  # restarting nginx (the variables in proxy_pass below force re-resolution).
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }


  
  



  server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    root         /usr/share/nginx/html;

    set $connection_gateway ws-gateway:8000;
    set $profile_ms profile:4000;
    set $media_ms media-metadata-ms:4001;
    set $channel_ms channel:4002;
    set $message_ms message:4003;
    set $notification_ms notification:4004;

    include /etc/nginx/routes.conf;

    error_page 404 /404.html;
      location = /40x.html {
    }

    error_page 500 502 503 504 /50x.html;
      location = /50x.html {
    }
  }
}
